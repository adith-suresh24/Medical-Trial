<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients - Hospital Management</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="sidebar-overlay"></div>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">🏥</div>
                <div class="brand-text">
                    <h2>Hospital HMS</h2>
                    <small>Management System</small>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Main</div>
                    <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
                    <a href="patients.html" class="nav-item active"><span class="nav-icon">👥</span> Patients</a>
                    <a href="reports.html" class="nav-item"><span class="nav-icon">📋</span> Reports</a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Clinical</div>
                    <a href="diagnosis.html" class="nav-item"><span class="nav-icon">🔬</span> Diagnosis</a>
                    <a href="discharge.html" class="nav-item"><span class="nav-icon">📄</span> Discharge</a>
                    <a href="history.html" class="nav-item"><span class="nav-icon">📚</span> History</a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">System</div>
                    <a href="logs.html" class="nav-item"><span class="nav-icon">📝</span> Access Logs</a>
                    <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span> Settings</a>
                </div>
            </nav>
        </aside>
        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button class="hamburger">☰</button>
                    <div class="header-search">
                        <span>🔍</span>
                        <input type="text" placeholder="Search..." id="globalSearch">
                    </div>
                </div>
                <div class="header-right">
                    <div class="user-menu" onclick="logout()">
                        <div class="user-avatar">SA</div>
                        <div class="user-info">
                            <strong>Loading...</strong>
                            <small>Loading...</small>
                        </div>
                    </div>
                </div>
            </header>
            <div class="page-content">
                <div class="page-header">
                    <div>
                        <h1>Patients</h1>
                        <p>Manage patient records</p>
                    </div>
                    <button class="btn btn-primary" onclick="openAddPatient()">+ Add Patient</button>
                </div>

                <div class="filters-bar">
                    <input type="text" class="form-control" id="searchPatient" placeholder="Search name, ID, phone..." style="min-width:250px">
                    <select class="form-control" id="filterStatus">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="discharged">Discharged</option>
                        <option value="transferred">Transferred</option>
                    </select>
                    <button class="btn btn-primary btn-sm" onclick="loadPatients()">🔍 Search</button>
                </div>

                <div class="card">
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Patient ID</th>
                                    <th>Name</th>
                                    <th>Gender</th>
                                    <th>Department</th>
                                    <th>Status</th>
                                    <th>Admission Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="patientsTable"></tbody>
                        </table>
                    </div>
                    <div id="patientsPagination" class="pagination"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Patient Modal -->
    <div class="modal-overlay" id="patientModal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h2 id="patientModalTitle">Add Patient</h2>
                <button class="modal-close" onclick="closeModal('patientModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="patientForm">
                    <input type="hidden" id="editPatientId">
                    <div class="grid-2">
                        <div class="form-group">
                            <label>First Name *</label>
                            <input type="text" class="form-control" id="firstName" required>
                        </div>
                        <div class="form-group">
                            <label>Last Name *</label>
                            <input type="text" class="form-control" id="lastName" required>
                        </div>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Date of Birth *</label>
                            <input type="date" class="form-control" id="dateOfBirth" required>
                        </div>
                        <div class="form-group">
                            <label>Gender *</label>
                            <select class="form-control" id="gender" required>
                                <option value="">Select</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Blood Group</label>
                            <select class="form-control" id="bloodGroup">
                                <option value="">Select</option>
                                <option value="A+">A+</option><option value="A-">A-</option>
                                <option value="B+">B+</option><option value="B-">B-</option>
                                <option value="AB+">AB+</option><option value="AB-">AB-</option>
                                <option value="O+">O+</option><option value="O-">O-</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="text" class="form-control" id="phone">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-control" id="email">
                    </div>
                    <div class="form-group">
                        <label>Address</label>
                        <textarea class="form-control" id="address" rows="2"></textarea>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Emergency Contact</label>
                            <input type="text" class="form-control" id="emergencyContact">
                        </div>
                        <div class="form-group">
                            <label>Emergency Phone</label>
                            <input type="text" class="form-control" id="emergencyPhone">
                        </div>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Admission Reason</label>
                            <textarea class="form-control" id="admissionReason" rows="2"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Department</label>
                            <select class="form-control" id="department">
                                <option value="">Select</option>
                                <option value="Cardiology">Cardiology</option>
                                <option value="Neurology">Neurology</option>
                                <option value="Orthopedics">Orthopedics</option>
                                <option value="Pediatrics">Pediatrics</option>
                                <option value="General Medicine">General Medicine</option>
                                <option value="Emergency">Emergency</option>
                                <option value="Oncology">Oncology</option>
                                <option value="Psychiatry">Psychiatry</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Ward Number</label>
                            <input type="text" class="form-control" id="wardNumber">
                        </div>
                        <div class="form-group">
                            <label>Bed Number</label>
                            <input type="text" class="form-control" id="bedNumber">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Medical History</label>
                        <textarea class="form-control" id="medicalHistory" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Allergies</label>
                        <textarea class="form-control" id="allergies" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Current Medications</label>
                        <textarea class="form-control" id="currentMedications" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeModal('patientModal')">Cancel</button>
                <button class="btn btn-primary" onclick="savePatient()">Save Patient</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/patients.js"></script>
</body>
</html>
