<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Logs - Hospital Management</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="sidebar-overlay"></div>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header"><div class="logo">🏥</div><div class="brand-text"><h2>Hospital HMS</h2><small>Management System</small></div></div>
            <nav class="sidebar-nav">
                <div class="nav-section"><div class="nav-section-title">Main</div>
                    <a href="dashboard.html" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
                    <a href="patients.html" class="nav-item"><span class="nav-icon">👥</span> Patients</a>
                    <a href="reports.html" class="nav-item"><span class="nav-icon">📋</span> Reports</a>
                </div>
                <div class="nav-section"><div class="nav-section-title">Clinical</div>
                    <a href="diagnosis.html" class="nav-item"><span class="nav-icon">🔬</span> Diagnosis</a>
                    <a href="discharge.html" class="nav-item"><span class="nav-icon">📄</span> Discharge</a>
                    <a href="history.html" class="nav-item"><span class="nav-icon">📚</span> History</a>
                </div>
                <div class="nav-section"><div class="nav-section-title">System</div>
                    <a href="logs.html" class="nav-item active"><span class="nav-icon">📝</span> Access Logs</a>
                    <a href="settings.html" class="nav-item"><span class="nav-icon">⚙️</span> Settings</a>
                </div>
            </nav>
        </aside>
        <main class="main-content">
            <header class="top-header">
                <div class="header-left"><button class="hamburger">☰</button>
                    <div class="header-search"><span>🔍</span><input type="text" placeholder="Search logs..." id="globalSearch"></div>
                </div>
                <div class="header-right">
                    <div class="user-menu" onclick="logout()">
                        <div class="user-avatar">SA</div>
                        <div class="user-info"><strong>Loading...</strong><small>Loading...</small></div>
                    </div>
                </div>
            </header>
            <div class="page-content">
                <div class="page-header">
                    <div><h1>📝 Access Logs</h1><p>Audit trail of all system activities</p></div>
                </div>
                <div class="filters-bar" style="flex-wrap:wrap">
                    <input type="text" class="form-control" id="logSearch" placeholder="Search logs..." style="min-width:200px">
                    <select class="form-control" id="logAction">
                        <option value="">All Actions</option>
                        <option value="LOGIN">Login</option>
                        <option value="LOGOUT">Logout</option>
                        <option value="PATIENT_CREATED">Patient Created</option>
                        <option value="PATIENT_UPDATED">Patient Updated</option>
                        <option value="PATIENT_DELETED">Patient Deleted</option>
                        <option value="REPORT_CREATED">Report Created</option>
                        <option value="REPORT_UPDATED">Report Updated</option>
                        <option value="PDF_GENERATED">PDF Generated</option>
                        <option value="AI_SUMMARY_GENERATED">AI Request</option>
                    </select>
                    <input type="date" class="form-control" id="logStartDate" style="width:160px">
                    <input type="date" class="form-control" id="logEndDate" style="width:160px">
                    <button class="btn btn-primary btn-sm" onclick="loadLogs()">🔍 Search</button>
                    <button class="btn btn-sm btn-outline" onclick="exportLogs()">📥 Export</button>
                </div>
                <div class="card">
                    <div class="table-container"><table><thead><tr><th>Date/Time</th><th>User</th><th>Action</th><th>Resource</th><th>Details</th><th>IP</th><th>Status</th></tr></thead>
                        <tbody id="logsTable"></tbody></table>
                    </div>
                    <div id="logsPagination" class="pagination"></div>
                </div>
            </div>
        </main>
    </div>
    <div id="toastContainer" class="toast-container"></div>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/logs.js"></script>
</body>
</html>
