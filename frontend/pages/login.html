<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hospital Management System</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-icon">🏥</div>
                <h1>Hospital Management</h1>
                <p>Sign in to access the system</p>
            </div>
            <div id="authError" class="auth-error"></div>
            <form id="loginForm" class="auth-form" autocomplete="off">
                <div class="form-group">
                    <label>👤 Username</label>
                    <input type="text" class="form-control" id="username"
                           placeholder="Enter username" required autofocus>
                </div>
                <div class="form-group">
                    <label>🔒 Password</label>
                    <div class="password-toggle">
                        <input type="password" class="form-control" id="password"
                               placeholder="Enter password" required>
                        <button type="button" class="toggle-btn" onclick="togglePassword()">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
                    Sign In
                </button>
            </form>
            <div style="text-align: center; margin-top: 20px; font-size: 12px; color: var(--gray-500);">
                <p>Demo Credentials:</p>
                <p>Admin: admin / admin123 | Doctor: doctor1 / doctor123 | Staff: staff1 / staff123</p>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
